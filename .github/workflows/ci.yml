name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clang-asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DYASL_SANITIZER=asan_ubsan
      - name: Build
        run: cmake --build build -j
      - name: Test (includes the include-policy and compile-fail checks)
        run: cd build && ctest --output-on-failure

  clang-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DYASL_SANITIZER=tsan
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: cd build && ctest --output-on-failure

  clang-lsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DYASL_SANITIZER=lsan
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          LSAN_OPTIONS: detect_leaks=1
        run: cd build && ctest --output-on-failure

  gcc-release-werror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: cd build && ctest --output-on-failure

  malloc-backends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        malloc: [tcmalloc, custom]
    steps:
      - uses: actions/checkout@v4
      - name: Build google/tcmalloc
        if: matrix.malloc == 'tcmalloc'
        run: third_party/tcmalloc_build/build.sh
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DYASL_MALLOC=${{ matrix.malloc }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: cd build && ctest --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: cd build && ctest --output-on-failure
      - name: Install and use from an external project
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/yasl"
          mkdir consumer && cd consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(yasl_macos_consumer LANGUAGES CXX)
          find_package(yasl REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE yasl::yasl)
          EOF
          cat > main.cpp <<'EOF'
          #include <yasl/io/output.h>
          #include <yasl/time/time.h>
          int main() { yasl::io::println("macOS {}", yasl::Duration::secs(1)); }
          EOF
          cmake -S . -B b -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/yasl"
          cmake --build b
          ./b/app

  hash-swar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DYASL_SANITIZE=ON -DCMAKE_CXX_FLAGS=-DYASL_HASH_SSE2=0
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: cd build && ctest --output-on-failure

  bazel:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        malloc: [libc, tcmalloc]
        exclude:
          - os: macos-latest
            malloc: tcmalloc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: bazel test --//:malloc=${{ matrix.malloc }} //:yasl_tests

  meson:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Meson
        run: pip3 install --user meson ninja || pip3 install --break-system-packages meson ninja
      - name: Build and test
        run: |
          python3 -m mesonbuild.mesonmain setup build-meson -Dbuildtype=release
          python3 -m mesonbuild.mesonmain test -C build-meson --print-errorlogs
          python3 -m mesonbuild.mesonmain install -C build-meson --destdir "$RUNNER_TEMP/yasl-meson"
          mkdir consumer-meson && cd consumer-meson
          printf "project('consumer', 'cpp', default_options: ['cpp_std=c++20'])\nyasl = dependency('yasl', method: 'pkg-config', required: true)\nexecutable('app', 'main.cpp', dependencies: yasl)\n" > meson.build
          printf '#include <yasl/io/output.h>\nint main() { yasl::io::println("ok {}", 1); }\n' > main.cpp
          PKG_CONFIG_PATH="$RUNNER_TEMP/yasl-meson/usr/local/lib/pkgconfig" python3 -m mesonbuild.mesonmain setup b
          PKG_CONFIG_PATH="$RUNNER_TEMP/yasl-meson/usr/local/lib/pkgconfig" python3 -m mesonbuild.mesonmain compile -C b

  include-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No standard library in the core
        run: cmake -DROOT=$PWD -P cmake/check_includes.cmake
      - name: Layer boundaries
        run: cmake -DROOT=$PWD -P cmake/check_layer_boundaries.cmake
      - name: Standalone public headers
        run: cmake -DROOT=$PWD -DCXX=${CXX:-c++} -P cmake/check_public_headers.cmake

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and use from an external project
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          cmake --install build --prefix "$RUNNER_TEMP/yasl"
          mkdir consumer && cd consumer
          printf 'cmake_minimum_required(VERSION 3.20)\nproject(c LANGUAGES CXX)\nfind_package(yasl REQUIRED)\nadd_executable(app main.cpp)\ntarget_link_libraries(app PRIVATE yasl::yasl)\n' > CMakeLists.txt
          printf '#include <yasl/io/file.h>\nint main() { yasl::io::println("ok {}", 1); }\n' > main.cpp
          cmake -S . -B b -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/yasl"
          cmake --build b
          ./b/app
